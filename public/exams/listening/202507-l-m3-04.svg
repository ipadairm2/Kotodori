<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#ffffff" />
  <!-- Classroom blackboard higher on wall so teacher head stays clear -->
  <rect x="26" y="24" width="246" height="132" rx="4" fill="#f1f5f9" stroke="#111827" stroke-width="2.6" />
  <rect x="38" y="34" width="222" height="108" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4" />
  <rect x="196" y="138" width="36" height="7" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1.5" />
  <line x1="16" y1="364" x2="624" y2="364" stroke="#cbd5e1" stroke-width="2" />

  <!-- Bold JLPT indicator arrow on right pointing left toward struggling student -->
  <path d="M 594 186 L 542 186 L 542 172 L 510 194 L 542 216 L 542 202 L 594 202 Z" fill="#0f172a" />

  <!-- Teacher standing left speaking softly -->
  <g transform="translate(148, 266)">
    <path d="M -20 58 L -22 140 L -4 140 L 2 86 L 8 140 L 26 140 L 22 58 Z" fill="#cbd5e1" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M -18 -46 L 18 -46 C 30 -40 32 -24 30 60 L -30 60 C -32 -24 -30 -40 -18 -46 Z" fill="#f8fafc" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="14" y="4" width="32" height="40" rx="3" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <rect x="-7" y="-58" width="14" height="12" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <circle cx="0" cy="-82" r="27" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
    <path d="M -25 -88 C -24 -114 14 -116 25 -90 C 14 -96 -6 -96 -25 -88 Z" fill="#94a3b8" stroke="#111827" stroke-width="2.1" />
    <!-- Glasses & faint quiet speech arcs -->
    <rect x="3" y="-88" width="11" height="7" rx="1.5" fill="none" stroke="#111827" stroke-width="1.6" />
    <circle cx="20" cy="-85" r="2.1" fill="#111827" />
    <circle cx="13" cy="-70" r="2.3" fill="#ffffff" stroke="#111827" stroke-width="1.6" />
    <path d="M 34 -76 Q 40 -72 34 -68" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 40 -79 Q 47 -72 40 -65" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Seated Student on right (arrow points here!) cupping hand behind ear -->
  <g transform="translate(432, 282)">
    <!-- School chair -->
    <path d="M 28 -2 L 32 82 L -14 82 L -14 122 M 32 82 L 32 122" fill="none" stroke="#111827" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Seated leg cleanly behind front desk edge -->
    <path d="M -18 44 L -32 116 L -12 116 L -2 56" fill="#cbd5e1" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Desk in front -->
    <rect x="-86" y="34" width="106" height="12" rx="3" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" />
    <line x1="-74" y1="46" x2="-74" y2="122" stroke="#111827" stroke-width="2.6" />
    <line x1="8" y1="46" x2="8" y2="122" stroke="#111827" stroke-width="2.6" />
    <polygon points="-68,34 -16,34 -8,22 -60,22" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <!-- Student torso -->
    <path d="M -16 -46 L 16 -46 C 24 -40 26 -24 24 34 L -24 34 C -26 -24 -24 -40 -16 -46 Z" fill="#ffffff" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />
    <!-- Left arm raised to speak politely -->
    <path d="M -24 -34 L -50 -70 L -40 -78 L -14 -38" fill="#ffffff" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" />
    <circle cx="-48" cy="-78" r="8" fill="#ffffff" stroke="#111827" stroke-width="2.1" />
    <!-- Right arm raised cupping ear -->
    <path d="M 24 -34 L 50 -60 L 28 -86 L 18 -80 L 36 -60 L 18 -40" fill="#ffffff" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" />
    <circle cx="24" cy="-84" r="8" fill="#ffffff" stroke="#111827" stroke-width="2.1" />
    <rect x="-7" y="-58" width="14" height="12" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <circle cx="-2" cy="-84" r="27" fill="#ffffff" stroke="#111827" stroke-width="2.6" />
    <path d="M -27 -90 C -22 -116 20 -116 25 -88 C 12 -96 -10 -96 -27 -90 Z" fill="#cbd5e1" stroke="#111827" stroke-width="2.2" />
    <circle cx="-16" cy="-83" r="2.4" fill="#111827" />
    <circle cx="-4" cy="-83" r="2.4" fill="#111827" />
    <path d="M -18 -90 L -11 -88 M -8 -88 L -1 -90" stroke="#111827" stroke-width="1.7" stroke-linecap="round" />
    <ellipse cx="-10" cy="-70" rx="3.8" ry="2.8" fill="#ffffff" stroke="#111827" stroke-width="1.7" />
  </g>
</svg>
