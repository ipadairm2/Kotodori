    <polygon points="14,-14 34,-4 26,12 8,6" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 32 0 Q 46 -2 40 12" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" />
    <polygon points="-38,8 -28,2 -24,14" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Apologetic Guest (left, bowing slightly, arrow points here) -->
  <g transform="translate(184, 268)">
    <path d="M -24 58 L -28 134 L 22 134 L 28 58 Z" fill="#cbd5e1" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />
    <g transform="rotate(8)">
