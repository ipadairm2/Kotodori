    <circle cx="0" cy="-88" r="28" fill="#ffffff" stroke="#111827" stroke-width="2.6" />
    <!-- Clean bob hair on top/right back -->
    <path d="M -27 -94 C -24 -122 22 -124 28 -94 C 30 -76 26 -62 18 -56 L 16 -86 C 6 -98 -12 -100 -27 -94 Z" fill="#cbd5e1" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" />
