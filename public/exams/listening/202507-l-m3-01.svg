      <path d="M -26 -94 C -25 -122 20 -124 29 -94 C 16 -102 -8 -102 -26 -94 Z" fill="#94a3b8" stroke="#111827" stroke-width="2.2" />
      <!-- Worried brows & face clearly visible -->
      <path d="M 2 -95 L 10 -98 M 16 -98 L 23 -94" stroke="#111827" stroke-width="1.9" stroke-linecap="round" />
      <circle cx="7" cy="-87" r="2.4" fill="#111827" />
      <circle cx="19" cy="-87" r="2.4" fill="#111827" />
      <ellipse cx="13" cy="-73" rx="4.2" ry="5" fill="#ffffff" stroke="#111827" stroke-width="1.9" />
      <path d="M -18 -98 Q -25 -88 -18 -84 Q -11 -88 -18 -98 Z" fill="#e2e8f0" stroke="#111827" stroke-width="1.6" />
    </g>
  </g>

  <!-- Surprised Host (right) -->
  <g transform="translate(495, 268)">
    <path d="M -26 58 L -20 134 L 30 134 L 24 58 Z" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M -18 -50 L 18 -50 C 30 -44 32 -28 30 60 L -30 60 C -32 -28 -30 -44 -18 -50 Z" fill="#f1f5f9" stroke="#111827" stroke-width="2.6" stroke-linejoin="round" />
    <path d="M -28 -28 L -56 2 L -46 14 L -22 -6" fill="#f1f5f9" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
