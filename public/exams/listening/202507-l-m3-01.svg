<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#ffffff" />
  <rect x="28" y="34" width="230" height="236" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 143 34 L 143 270 M 28 112 L 258 112 M 28 192 L 258 192" stroke="#cbd5e1" stroke-width="1.6" />
  <line x1="20" y1="320" x2="620" y2="320" stroke="#cbd5e1" stroke-width="2" />

  <!-- Bold JLPT indicator arrow pointing at apologetic guest on left -->
  <path d="M 46 154 L 98 154 L 98 140 L 130 162 L 98 184 L 98 170 L 46 170 Z" fill="#0f172a" />

  <!-- Low Japanese Coffee Table in center -->
  <g transform="translate(345, 326)">
    <rect x="-86" y="-8" width="172" height="14" rx="4" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" />
    <rect x="-72" y="6" width="14" height="58" fill="#cbd5e1" stroke="#111827" stroke-width="2.2" />
    <rect x="58" y="6" width="14" height="58" fill="#cbd5e1" stroke="#111827" stroke-width="2.2" />
    <ellipse cx="32" cy="-9" rx="22" ry="5" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <rect x="20" y="-27" width="24" height="18" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <path d="M 44 -23 Q 52 -18 44 -13" fill="none" stroke="#111827" stroke-width="2" />
  </g>

  <!-- Spilled coffee puddle & broken cup shards -->
  <g transform="translate(278, 412)">
