      <circle cx="60" cy="-4" r="8.5" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
      <rect x="-8" y="-62" width="16" height="14" fill="#ffffff" stroke="#111827" stroke-width="2" />
      <circle cx="2" cy="-88" r="28" fill="#ffffff" stroke="#111827" stroke-width="2.6" />
