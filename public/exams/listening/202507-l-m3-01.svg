    <circle cx="-2" cy="-86" r="2.4" fill="#111827" />
    <circle cx="-9" cy="-73" r="3.4" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
    <path d="M -38 -116 L -48 -126 M -42 -102 L -56 -106" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" />
