<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <rect width="640" height="480" fill="#ffffff" />
  <path d="M 38 355 Q 80 315 125 348 Q 165 322 200 355" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8" />
  <path d="M 468 355 Q 515 312 560 342 Q 595 325 620 355" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.8" />
  <line x1="20" y1="355" x2="620" y2="355" stroke="#cbd5e1" stroke-width="1.8" />
  <line x1="24" y1="398" x2="616" y2="398" stroke="#cbd5e1" stroke-width="1.8" />

  <!-- Bold JLPT indicator arrow pointing at left speaker holding baseball tickets -->
  <path d="M 48 168 L 102 168 L 102 154 L 134 176 L 102 198 L 102 184 L 48 184 Z" fill="#0f172a" />

  <!-- Right Listener (friend) -->
  <g transform="translate(465, 252)">
    <path d="M -24 58 L -28 158 L -8 158 L 0 92 L 8 158 L 28 158 L 24 58 Z" fill="#e2e8f0" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />
    <ellipse cx="-20" cy="162" rx="17" ry="7.5" fill="#cbd5e1" stroke="#111827" stroke-width="2.3" />
    <ellipse cx="20" cy="162" rx="17" ry="7.5" fill="#cbd5e1" stroke="#111827" stroke-width="2.3" />
    <!-- Sweater torso with smooth shoulders -->
    <path d="M -18 -56 L 18 -56 C 34 -52 40 -36 42 4 L 36 60 L -36 60 L -42 4 C -40 -36 -34 -52 -18 -56 Z" fill="#f8fafc" stroke="#111827" stroke-width="2.6" stroke-linejoin="round" />
    <path d="M -14 -55 Q 0 -42 14 -55" fill="none" stroke="#111827" stroke-width="2" />
    <!-- Relaxed arms -->
    <path d="M -38 -36 L -54 14 Q -46 28 -32 22 L -28 0" fill="#f8fafc" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
    <circle cx="-50" cy="18" r="8" fill="#ffffff" stroke="#111827" stroke-width="2.1" />
    <path d="M 38 -36 L 48 34 Q 40 46 30 38 L 28 0" fill="#f8fafc" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Neck & Head -->
    <rect x="-8" y="-70" width="16" height="16" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
    <circle cx="0" cy="-98" r="30" fill="#ffffff" stroke="#111827" stroke-width="2.6" />
    <!-- Hair strictly on top/back above forehead line y=-106 -->
    <path d="M -29 -104 C -28 -134 18 -138 30 -106 C 32 -90 26 -72 18 -68 L 16 -96 C 6 -108 -16 -108 -29 -104 Z" fill="#cbd5e1" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" />
    <circle cx="-13" cy="-97" r="2.6" fill="#111827" />
    <circle cx="1" cy="-97" r="2.6" fill="#111827" />
    <path d="M -14 -82 Q -7 -77 0 -82" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Left Speaker (friend holding 2 baseball tickets, arrow points here) -->
  <g transform="translate(208, 250)">
    <path d="M -24 60 L -28 160 L -8 160 L 0 94 L 8 160 L 28 160 L 24 60 Z" fill="#cbd5e1" stroke="#111827" stroke-width="2.5" stroke-linejoin="round" />
    <ellipse cx="-18" cy="164" rx="17" ry="7.5" fill="#e2e8f0" stroke="#111827" stroke-width="2.3" />
    <ellipse cx="22" cy="164" rx="18" ry="7.5" fill="#e2e8f0" stroke="#111827" stroke-width="2.3" />
    <!-- Jacket with collar -->
    <path d="M -18 -56 L 18 -56 C 34 -52 40 -34 40 8 L 36 62 L -36 62 L -40 8 C -40 -34 -34 -52 -18 -56 Z" fill="#f1f5f9" stroke="#111827" stroke-width="2.6" stroke-linejoin="round" />
    <path d="M -12 -56 L 0 -38 L 12 -56" fill="#ffffff" stroke="#111827" stroke-width="2" />
    <line x1="2" y1="-38" x2="2" y2="62" stroke="#111827" stroke-width="1.9" />
    <!-- Left arm -->
    <path d="M -38 -36 L -48 36 Q -38 46 -28 38 L -28 0" fill="#f1f5f9" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
    <!-- Extended arm holding tickets -->
    <path d="M 34 -34 L 94 -14 L 88 2 L 32 -12" fill="#f1f5f9" stroke="#111827" stroke-width="2.4" stroke-linejoin="round" />
    <circle cx="94" cy="-8" r="8.5" fill="#ffffff" stroke="#111827" stroke-width="2.1" />
    <!-- Two fanned baseball tickets -->
    <g transform="translate(118, -28)">
      <g transform="rotate(-10)">
        <rect x="-12" y="-34" width="44" height="62" rx="4" fill="#f8fafc" stroke="#111827" stroke-width="2.2" />
        <line x1="-12" y1="12" x2="32" y2="12" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 2" />
      </g>
      <g transform="translate(12, 4) rotate(8)">
        <rect x="-14" y="-36" width="46" height="64" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
        <line x1="-14" y1="12" x2="32" y2="12" stroke="#64748b" stroke-width="1.4" stroke-dasharray="3 2" />
        <circle cx="9" cy="-12" r="13.5" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
        <path d="M 0 -22 Q 7 -12 0 -2 M 18 -22 Q 11 -12 18 -2" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" />
        <path d="M 3 -18 L 6 -17 M 4 -12 L 7 -12 M 3 -6 L 6 -7 M 15 -18 L 12 -17 M 14 -12 L 11 -12 M 15 -6 L 12 -7" stroke="#0f172a" stroke-width="1.3" />
      </g>
    </g>
    <rect x="-8" y="-70" width="16" height="16" fill="#ffffff" stroke="#111827" stroke-width="2.2" />
    <circle cx="0" cy="-98" r="30" fill="#ffffff" stroke="#111827" stroke-width="2.6" />
    <!-- Hair strictly above forehead y=-106 -->
    <path d="M -29 -104 C -30 -134 18 -138 29 -108 C 20 -114 0 -112 -16 -108 C -20 -100 -24 -94 -29 -104 Z" fill="#94a3b8" stroke="#111827" stroke-width="2.3" stroke-linejoin="round" />
    <circle cx="5" cy="-97" r="2.6" fill="#111827" />
    <circle cx="18" cy="-97" r="2.6" fill="#111827" />
    <path d="M 5 -83 Q 12 -76 20 -83" fill="none" stroke="#111827" stroke-width="2.1" stroke-linecap="round" />
  </g>
</svg>
